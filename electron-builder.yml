appId: com.sahilshingate.oceanliteracy
productName: Ocean Literacy
copyright: Copyright © 2026 Sahil Shingate
directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!dist/**"
  - "!build/**"
  - "!release/**"
  - "!scripts/**"
  - "!test/**"
  - "!**/*.md"
  - "!.github/**"

extraResources:
  - from: "assets"
    to: "assets"
    filter:
      - "**/*"

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icons/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ocean Literacy
  include: build/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icons/icon.png
  category: Education;Science;
